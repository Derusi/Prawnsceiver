# Optimized direwolf config for receive-only APRS IGate
# Using RTL-SDR with R820T tuner on 144.8 MHz (Europe APRS Simplex)

# Audio device: null for output (we don't transmit), input via stdin
ADEVICE null null
CHANNEL 0
MYCALL N0CALL

# 1200 baud AFSK (APRS standard)
MODEM 1200

# AGW and KISS ports (avoid conflicting with nginx on 8000)
AGWPORT 8002
KISSPORT 8003

# Enable IGate (relay received packets to APRS-IS)
# This forwards local packets to the global APRS network
IGSERVER euro.aprs2.net
IGLOGIN N0CALL -1

# DTMF decoder disabled (not needed for RX-only)
# PTT disabled (receive only)
