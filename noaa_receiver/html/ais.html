<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOAAh's CrabArk — AIS Tracking Log</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; font-size: 16px; background: #1a1a2e; color: #e0e0e0; padding: 12px 15px; }
h1 { font-size: 1.2em; color: #53d769; margin-bottom: 4px; }
.sub { font-size: 1em; color: #888; margin-bottom: 12px; }
.sub a { color: #53d769; }
#toolbar { display: flex; gap: 15px; font-size: 0.85em; color: #888; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
#toolbar label { cursor: pointer; }
#toolbar select { background: #0f3460; color: #e0e0e0; border: 1px solid #53d769; border-radius: 3px; font-family: monospace; padding: 1px 4px; }
#stats { color: #4da6ff; font-size: 0.9em; margin-bottom: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
th { text-align: left; color: #888; border-bottom: 1px solid #0f3460; padding: 4px 6px; position: sticky; top: 0; background: #1a1a2e; }
td { padding: 3px 6px; border-bottom: 1px solid #16213e; white-space: nowrap; }
tr:hover td { background: #16213e; }
tr.cls-B td:first-child { border-left: 2px solid #4da6ff; }
tr.cls-A td:first-child { border-left: 2px solid #53d769; }
tr.cls-BASE td:first-child, tr.cls-ATON td:first-child, tr.cls-SAR td:first-child, tr.cls-LR td:first-child { border-left: 2px solid #f39c12; }
.t { color: #666; }
.ch { color: #4da6ff; }
.type { color: #888; }
.mmsi { color: #e0e0e0; }
.name { color: #53d769; font-weight: bold; }
.pos a { color: #4da6ff; text-decoration: none; }
.pos a:hover { text-decoration: underline; }
.na { color: #555; }
.nmea { color: #555; font-size: 0.75em; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.muted { color: #666; padding: 10px; }
#mapwrap { margin-bottom: 14px; }
#mapinfo { font-size: 0.85em; color: #888; margin: 4px 0 6px; display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
#fitbtn { background: #0f3460; color: #4da6ff; border: 1px solid #4da6ff; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 0.9em; padding: 1px 8px; }
#fitbtn:hover { background: #16294e; }
#map { height: 460px; border: 1px solid #0f3460; border-radius: 4px; background: #000; }
.leaflet-tile { filter: brightness(0.9) saturate(0.85); }
.leaflet-container { background: #000; font-family: monospace; }
.shipIcon { position: relative; width: 28px; height: 28px; }
.shipIcon .rot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.shipIcon svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9)); }
.shipIcon .lbl { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 10px monospace; color: #e0e0e0; text-shadow: 0 1px 2px #000, 0 0 2px #000; pointer-events: none; }
.shipIcon.stale, .shipIcon.stale .lbl { opacity: 0.55; }
.shipIcon.stale .lbl { font-style: italic; }
</style>
</head>
<body>
<h1>🚢 AIS Tracking Log — Danube Ship Traffic</h1>
<div class="sub"><a href="/">&#8592; dashboard</a> &nbsp;|&nbsp; <a href="/ais.json">live ship table (JSON)</a> &nbsp;|&nbsp; 161.975 / 162.025 MHz</div>
<div id="toolbar">
    <label><input type="checkbox" id="autorefresh" checked> auto-refresh (10 s)</label>
    <span>show last</span>
    <select id="count">
        <option value="100">100</option>
        <option value="200" selected>200</option>
        <option value="500">500</option>
        <option value="2000">2000</option>
    </select>
    <span>frames</span>
    <span id="loadinfo"></span>
</div>
<div id="stats">Loading...</div>
<div id="mapwrap">
    <div id="mapinfo">
        <span id="mapstats">map: waiting for ship positions…</span>
        <button id="fitbtn" title="Zoom/pan the map to all ships">&#8690; fit ships</button>
    </div>
    <div id="map"></div>
</div>
<table>
<thead><tr>
    <th>time</th><th>ch</th><th>type</th><th>MMSI</th><th>name</th>
    <th>position</th><th>sog</th><th>cog</th><th>hdg</th><th>status</th><th>raw NMEA</th>
</tr></thead>
<tbody id="rows"><tr><td colspan="11" class="muted">Loading AIS log...</td></tr></tbody>
</table>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const MSG_NAMES = {
    1: 'position (A)', 2: 'position (A)', 3: 'position (A)',
    4: 'base station', 5: 'static/voyage', 9: 'SAR aircraft',
    11: 'UTC response', 18: 'position (B)', 19: 'position ext (B)',
    21: 'aid to nav', 24: 'static (B)', 27: 'long range'
};
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function cell(v, cls, dash) { return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + (v === null || v === undefined ? '<span class="na">' + (dash || '—') + '</span>' : v) + '</td>'; }

// ---------- live ship map (Leaflet + OpenStreetMap tiles) ----------
// Ships are placed by their latest position report and rotated by their
// true heading (fallback: course over ground; 511 = n/a per AIS spec).
// Class colors match the table: A green, B blue, everything else orange;
// aids to navigation (ATON) get a diamond instead of a ship arrow.
let map = null, markers = {}, fitted = false;
function initMap() {
    if (typeof L === 'undefined') {
        const d = document.getElementById('map');
        d.innerHTML = '<div class="muted">Map library (Leaflet CDN) unreachable — the log below still works.</div>';
        d.style.height = 'auto';
        return;
    }
    map = L.map('map').setView([48.99, 12.09], 13);   // Danube at Regensburg, refit to ships on data
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    document.getElementById('fitbtn').onclick = () => { fitted = false; fitShips(); };
}
function shipPopup(s, age) {
    const pos = (s.lat !== undefined && s.lat !== null)
        ? s.lat.toFixed(4) + ', ' + s.lon.toFixed(4) : '—';
    const seenAt = new Date(s.last_seen * 1000).toLocaleTimeString();
    return '<b>' + esc(s.name || '(unnamed)') + '</b> · class ' + esc(s.cls || '?') + '<br>'
        + 'MMSI ' + esc(s.mmsi) + (s.callsign ? ' · ' + esc(s.callsign) : '') + '<br>'
        + 'sog ' + (s.sog !== undefined && s.sog !== null ? s.sog + ' kn' : '—')
        + ' · cog ' + (s.cog !== undefined && s.cog !== null ? s.cog + '\u00b0' : '—')
        + ' · hdg ' + (s.heading !== undefined && s.heading !== null ? s.heading + '\u00b0' : '—') + '<br>'
        + pos + ' · last seen ' + seenAt + ' (' + age + ' s ago)';
}
function shipIcon(s) {
    const rot = (s.heading !== undefined && s.heading !== null && s.heading !== 511)
        ? s.heading
        : (s.cog !== undefined && s.cog !== null ? s.cog : 0);
    const color = s.cls === 'A' ? '#53d769' : (s.cls === 'B' ? '#4da6ff' : '#f39c12');
    const shape = s.cls === 'ATON'
        ? '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z" fill="' + color + '" stroke="#10131f" stroke-width="1.4"/></svg>'
        : '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 1 L17.5 11 L14.2 11 L14.2 17 L9.8 17 L9.8 11 L6.5 11 Z" fill="' + color + '" stroke="#10131f" stroke-width="1"/></svg>';
    const stale = (Date.now() / 1000 - s.last_seen) > 600;   // silent for 10+ min
    return L.divIcon({
        className: '',
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -12],
        html: '<div class="shipIcon' + (stale ? ' stale' : '') + '">'
            + '<div class="rot" style="transform: rotate(' + rot + 'deg)">' + shape + '</div>'
            + (s.name ? '<div class="lbl">' + esc(s.name) + '</div>' : '')
            + '</div>'
    });
}
function fitShips() {
    if (!map || !fitted) return;
    const ms = Object.values(markers);
    if (!ms.length) return;
    map.fitBounds(L.latLngBounds(ms.map(m => m.getLatLng())).pad(0.25));
}
function updateMap(ships) {
    if (!map) return;
    const now = Date.now() / 1000;
    const seen = new Set();
    let onMap = 0, noPos = 0, staleCount = 0;
    for (const s of ships) {
        if (s.lat === undefined || s.lat === null || s.lon === undefined || s.lon === null) {
            noPos++;
            continue;
        }
        seen.add(String(s.mmsi));
        onMap++;
        const age = Math.max(0, Math.round(now - s.last_seen));
        if (age > 600) staleCount++;
        let m = markers[s.mmsi];
        if (!m) {
            m = markers[s.mmsi] = L.marker([s.lat, s.lon], { title: s.name || String(s.mmsi) }).addTo(map);
            m.bindPopup(shipPopup(s, age));
        } else {
            m.setLatLng([s.lat, s.lon]);
        }
        m.setIcon(shipIcon(s));           // latest position AND rotation every refresh
        m.setPopupContent(shipPopup(s, age));
    }
    for (const k of Object.keys(markers)) {
        if (!seen.has(k)) { map.removeLayer(markers[k]); delete markers[k]; }
    }
    if (onMap && !fitted) fitted = true, fitShips();
    document.getElementById('mapstats').textContent =
        onMap + ' ship' + (onMap === 1 ? '' : 's') + ' with position on the map'
        + (staleCount ? ' · ' + staleCount + ' faded (not heard for 10+ min)' : '')
        + (noPos ? ' · ' + noPos + ' without position yet' : '');
}
initMap();

async function load() {
    try {
        const n = document.getElementById('count').value;
        const res = await fetch('/aislog.json?count=' + n);
        const log = await res.json();
        const sres = await fetch('/ais.json');
        const s = await sres.json();
        const ch = s.channels || {};
        const chA = ch.A ? ch.A.frames : 0, chB = ch.B ? ch.B.frames : 0;
        document.getElementById('stats').textContent =
            (s.enabled ? 'Receiver live on dongle ' + s.dongle
                        : 'AIS disabled (AIS dongle not added) — showing the persisted log')
            + ' · frames decoded: ch A ' + chA + ' + ch B ' + chB
            + ' (' + (chA + chB) + ' this run) · ships tracked: ' + s.ships.length;
        document.getElementById('loadinfo').textContent = ' · showing ' + log.length + ' log lines';
        updateMap(s.ships);
        const rows = document.getElementById('rows');
        if (!log.length) {
            rows.innerHTML = '<tr><td colspan="11" class="muted">No AIS frames decoded yet — the log fills as ships come into range.</td></tr>';
            return;
        }
        let html = '';
        for (const e of log) {
            const pos = (e.lat !== null && e.lat !== undefined)
                ? '<a href="https://www.google.com/maps?q=' + e.lat + ',' + e.lon + '" target="_blank" rel="noopener">' + e.lat.toFixed(4) + ', ' + e.lon.toFixed(4) + '</a>'
                : null;
            html += '<tr class="cls-' + esc(e.cls || '') + '" title="' + esc(e.nmea || '') + '">'
                + cell(esc(e.time), 't')
                + cell(esc(e.ch), 'ch')
                + cell(esc(e.msg + ' ' + (MSG_NAMES[e.msg] || '?')), 'type')
                + cell(esc(e.mmsi), 'mmsi')
                + cell(esc(e.name || ''), 'name')
                + cell(pos, 'pos')
                + cell(e.sog !== null && e.sog !== undefined ? e.sog + ' kn' : null)
                + cell(e.cog !== null && e.cog !== undefined ? e.cog + '\u00b0' : null)
                + cell(e.hdg !== null && e.hdg !== undefined ? e.hdg + '\u00b0' : null)
                + cell(esc(e.status || e.callsign || ''))
                + cell(esc(e.nmea || ''), 'nmea')
                + '</tr>';
        }
        rows.innerHTML = html;
    } catch (err) {
        console.error('AIS log load failed:', err);
    }
}

document.getElementById('count').addEventListener('change', load);
let timer = null;
function setTimer() {
    if (timer) clearInterval(timer);
    if (document.getElementById('autorefresh').checked) timer = setInterval(load, 10000);
}
document.getElementById('autorefresh').addEventListener('change', setTimer);
load();
setTimer();
</script>
</body>
</html>
